name: Deploy repository to Github Pages

# Publishes the plugin source index only for deliberate releases, and only after the tests have passed:
# Stash offers an update whenever the index date changes, so ordinary pushes must not publish, and a broken
# build must never go live. A release is a push to main whose plugin version (plugins/imaglrIntegration/
# imaglrIntegration.yml) differs from the one already published; it can also be run by hand from the
# Actions tab, which publishes regardless. GitHub Pages only makes deployments from main live, so this
# never runs from a tag.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

env:
  INDEX_URL: https://sentientslimemould.github.io/stash-imaglr-integration/stable/index.yml

jobs:
  build:
    # Only after a green test run on main (or by hand).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: '0'
    - name: Publish only when the plugin version changed
      id: version
      run: |
        new=$(sed -n 's/^version: *//p' plugins/imaglrIntegration/imaglrIntegration.yml | tr -d '[:space:]')
        live=$(curl -fsSL "$INDEX_URL" | sed -n 's/^ *version: *\([0-9][0-9.]*\).*/\1/p' | head -1 || true)
        echo "in repo: $new, published: ${live:-none}"
        if [ "$new" = "$live" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "Version unchanged: nothing to publish."
        else
          echo "publish=true" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.version.outputs.publish == 'true'
      run: |
        chmod +x build_site.sh
        ./build_site.sh _site/stable
    - if: steps.version.outputs.publish == 'true'
      uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}stable/index.yml
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.publish == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
