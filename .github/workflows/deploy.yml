name: Deploy repository to Github Pages

# Publishes the plugin source index only for deliberate releases: Stash offers an update whenever the
# index date changes, so ordinary pushes must not publish. A release is a push to main that changes the
# plugin's version (plugins/imaglrIntegration/imaglrIntegration.yml); it can also be run by hand from the
# Actions tab. GitHub Pages only makes deployments from main live, so this never runs from a tag.
on:
  push:
    branches:
      - main
    paths:
      - 'plugins/imaglrIntegration/imaglrIntegration.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: '0'
    - run: |
        chmod +x build_site.sh
        ./build_site.sh _site/stable
    - uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}stable/index.yml
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
