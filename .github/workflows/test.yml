name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: No private content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sh scripts/check-generic.sh --all

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest we support on bare-metal installs, and current.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests/python -t . -v

  stash-images:
    name: Python in stashapp/stash:${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [v0.31.1, development]
    steps:
      - uses: actions/checkout@v6
      - run: >
          docker run --rm -v "$PWD":/w -w /w --entrypoint python3 stashapp/stash:${{ matrix.tag }}
          -m unittest discover -s tests/python -t . -v

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Committed bundle matches the source
        run: |
          npm run build
          git diff --exit-code -- plugins/imaglrIntegration/imaglrIntegration.js plugins/imaglrIntegration/imaglrIntegration.css \
            || { echo "::error::Run 'npm run build' and commit the result."; exit 1; }

  e2e:
    # The real thing: the built plugin inside stashapp/stash:v0.31.1 sending an image and a clip to the
    # fake imaglr (dev/e2e.py), including ffmpeg inside the container and the Stash tag swaps.
    name: End to end in stashapp/stash:v0.31.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Stage the plugin as Stash will see it
        run: |
          mkdir -p "$RUNNER_TEMP/plugin"
          cp -R plugins/imaglrIntegration/. "$RUNNER_TEMP/plugin/"
          rm -rf "$RUNNER_TEMP/plugin/data" && mkdir "$RUNNER_TEMP/plugin/data"  # empty mount point for the data volume
          echo "IMAGLR_DEV_PLUGIN=$RUNNER_TEMP/plugin" >> "$GITHUB_ENV"
      - name: Start Stash and the fake imaglr
        working-directory: dev
        run: |
          docker compose run --rm make-media
          docker compose up -d stash-v0311 fake-imaglr
      - name: Seed and run
        working-directory: dev
        run: |
          python3 seed.py 9931 setup
          python3 e2e.py 9931
      - name: Stash log
        if: failure()
        working-directory: dev
        run: docker compose logs --no-color stash-v0311 fake-imaglr | tail -200
      - name: Stop
        if: always()
        working-directory: dev
        run: docker compose down -v
