name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: No private content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sh scripts/check-generic.sh --all

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest we support on bare-metal installs, and current; Windows because bare-metal Stash runs there
        # too (process handling and paths differ). macOS runners are not reliably available to this
        # repository, so macOS is checked by hand (see dev/README.md). Ubuntu is pinned: 26.04 (ubuntu-latest
        # from November 2026) has no Python 3.9 build.
        python: ["3.9", "3.13"]
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests/python -t . -v

  stash-images:
    name: Python in stashapp/stash:${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [v0.31.1, v0.32.0, development]
    steps:
      - uses: actions/checkout@v6
      - run: >
          docker run --rm -v "$PWD":/w -w /w --entrypoint python3 stashapp/stash:${{ matrix.tag }}
          -m unittest discover -s tests/python -t . -v

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Committed bundle matches the source
        run: |
          npm run build
          git diff --exit-code -- plugins/imaglrIntegration/imaglrIntegration.js plugins/imaglrIntegration/imaglrIntegration.css \
            || { echo "::error::Run 'npm run build' and commit the result."; exit 1; }

  e2e:
    # The real thing: the built plugin inside Stash sending an image and a clip to the fake imaglr (dev/e2e.py),
    # including ffmpeg inside the container and the Stash tag swaps, then every page loaded in Chrome
    # (dev/ui_check.mjs). v0.31.1 is the oldest supported release (React 17); v0.32.0 the first with React 18.
    name: End to end in stashapp/stash:${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: v0.31.1, service: stash-v0311, port: 9931 }
          - { tag: v0.32.0, service: stash-v0320, port: 9934 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Stage the plugin as Stash will see it
        run: |
          mkdir -p "$RUNNER_TEMP/plugin"
          cp -R plugins/imaglrIntegration/. "$RUNNER_TEMP/plugin/"
          rm -rf "$RUNNER_TEMP/plugin/data" && mkdir "$RUNNER_TEMP/plugin/data"  # empty mount point for the data volume
          echo "IMAGLR_DEV_PLUGIN=$RUNNER_TEMP/plugin" >> "$GITHUB_ENV"
      - name: Start Stash and the fake imaglr
        working-directory: dev
        run: |
          docker compose run --rm make-media
          docker compose up -d ${{ matrix.service }} fake-imaglr
      - name: Seed and run
        working-directory: dev
        run: |
          python3 seed.py ${{ matrix.port }} setup
          python3 seed.py ${{ matrix.port }} saving
          python3 e2e.py ${{ matrix.port }}
      - name: Every page in Chrome
        run: node dev/ui_check.mjs ${{ matrix.port }}
      - name: Stash log
        if: failure()
        working-directory: dev
        run: docker compose logs --no-color ${{ matrix.service }} fake-imaglr | tail -200
      - name: Stop
        if: always()
        working-directory: dev
        run: docker compose down -v
