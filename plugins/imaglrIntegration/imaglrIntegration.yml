name: Imaglr Integration
description: Share images and clips from Stash to your imaglr blogs as drafts, queued posts or published posts.
version: 0.1.3
url: https://github.com/SentientSlimeMould/stash-imaglr-integration
exec:
  - python
  - "{pluginDir}/main.py"
interface: raw
ui:
  javascript:
    - imaglrIntegration.js
  css:
    - imaglrIntegration.css
  # Previews of prepared files (frame grabs, processed outputs). Only data/prepared is served, never the
  # database next to it; Stash's file server refuses paths that climb out of the mapped folder.
  assets:
    /prepared: data/prepared
settings:
  # Stash lists settings sorted by these keys, so they are named to keep the order sensible.
  # Numbers are STRING settings so an unsaved value shows empty rather than 0.
  tagQueue:
    displayName: Queue tag
    description: Markers and images with this Stash tag appear on the Post to imaglr page. Leave empty for "imaglr". To change it later, rename the tag in Stash too so tagged items keep showing.
    type: STRING
  tagSent:
    displayName: Sent tag
    description: Replaces the queue tag once an item is sent. Leave empty for "imaglr-sent". Must differ from the queue tag.
    type: STRING
  tagsKeepCapitals:
    displayName: Keep tag capitals
    description: Send tags with their capital letters. Off (the default) sends them in lower case.
    type: BOOLEAN
  tagsNeverSuggested:
    displayName: Tags never suggested
    description: Comma-separated regular expressions; matching Stash tags are not suggested for imaglr. Leave empty for "^AI_".
    type: STRING
  videoDefaultClipSeconds:
    displayName: Default clip length (seconds)
    description: Used when a marker has no end time. Leave empty for 15.
    type: STRING
  workingFilesKeepDays:
    displayName: Keep prepared files (days)
    description: How long processed files are kept after sending. Leave empty for 14.
    type: STRING
