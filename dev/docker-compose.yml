# Local test Stash instances for developing the plugin. See dev/README.md.
#
# The project folder may sit on a network share, and SQLite must not, so every database,
# generated file and test media file lives in a Docker volume. Only the plugin code is
# mounted (read-only) from a local copy made by `npm run dev` / `npm run dev:sync` (scripts/dev-sync.sh),
# with the plugin's own data folder overlaid by a volume.
name: imaglr-dev

x-stash: &stash
  restart: "no"
  environment:
    STASH_STASH: /data/
    STASH_GENERATED: /generated/
    STASH_METADATA: /metadata/
    STASH_CACHE: /cache/
    STASH_PORT: "9999"
    # Development only: where the plugin sends imaglr API calls. Defaults to the fake server;
    # run `IMAGLR_API_BASE=https://imaglr.com/api/v2 docker compose up -d` for a real-imaglr checkpoint.
    IMAGLR_API_BASE: ${IMAGLR_API_BASE:-http://fake-imaglr:8900/api/v2}
    # Development only, honoured only alongside IMAGLR_API_BASE: drafts whose files total more than this many
    # bytes go up in pieces, so the test clips exercise imaglr's chunked uploads against the fake.
    IMAGLR_SINGLE_REQUEST_LIMIT: "1048576"

services:
  # Oldest supported release.
  stash-v0311:
    <<: *stash
    image: stashapp/stash:v0.31.1
    ports: ["127.0.0.1:9931:9999"]
    volumes:
      - v0311-config:/root/.stash
      - v0311-generated:/generated
      - v0311-metadata:/metadata
      - v0311-cache:/cache
      - v0311-blobs:/blobs
      - media:/data:ro
      - ${IMAGLR_DEV_PLUGIN:-${HOME}/.imaglr-dev/plugin}:/root/.stash/plugins/imaglrIntegration:ro
      - v0311-plugin-data:/root/.stash/plugins/imaglrIntegration/data

  # Stash's development build: early warning of upcoming changes.
  stash-dev:
    <<: *stash
    image: stashapp/stash:development
    ports: ["127.0.0.1:9932:9999"]
    volumes:
      - dev-config:/root/.stash
      - dev-generated:/generated
      - dev-metadata:/metadata
      - dev-cache:/cache
      - dev-blobs:/blobs
      - media:/data:ro
      - ${IMAGLR_DEV_PLUGIN:-${HOME}/.imaglr-dev/plugin}:/root/.stash/plugins/imaglrIntegration:ro
      - dev-plugin-data:/root/.stash/plugins/imaglrIntegration/data

  # Demo instance for screenshots and recordings: public-domain, SFW media fetched by dev/demo_media.py into
  # ~/.imaglr-dev/demo-media, friendly metadata from `seed.py 9933 demo`, and the REAL imaglr (no fake), so
  # add real demo blogs to it. Start on its own: docker compose up -d stash-demo
  stash-demo:
    <<: *stash
    image: stashapp/stash:v0.31.1
    ports: ["127.0.0.1:9933:9999"]
    environment:
      STASH_STASH: /data/
      STASH_GENERATED: /generated/
      STASH_METADATA: /metadata/
      STASH_CACHE: /cache/
      STASH_PORT: "9999"
    volumes:
      - demo-config:/root/.stash
      - demo-generated:/generated
      - demo-metadata:/metadata
      - demo-cache:/cache
      - demo-blobs:/blobs
      - ${IMAGLR_DEMO_MEDIA:-${HOME}/.imaglr-dev/demo-media}:/data:ro
      - ${IMAGLR_DEV_PLUGIN:-${HOME}/.imaglr-dev/plugin}:/root/.stash/plugins/imaglrIntegration:ro
      - demo-plugin-data:/root/.stash/plugins/imaglrIntegration/data

  # Fake imaglr API (dev/fake_imaglr.py). Received posts: http://127.0.0.1:8900/
  fake-imaglr:
    image: stashapp/stash:v0.31.1
    entrypoint: ["python3", "-u", "/scripts/fake_imaglr.py", "8900", "/state"]
    ports: ["127.0.0.1:8900:8900"]
    volumes:
      - fake-imaglr-state:/state
      - ./fake_imaglr.py:/scripts/fake_imaglr.py:ro

  # One-off: generates synthetic test media into the shared media volume.
  #   docker compose run --rm make-media
  make-media:
    image: stashapp/stash:v0.31.1
    profiles: [tools]
    entrypoint: ["python3", "/scripts/make_media.py", "/out"]
    volumes:
      - media:/out
      - ./make_media.py:/scripts/make_media.py:ro

volumes:
  media:
  fake-imaglr-state:
  v0311-config:
  v0311-generated:
  v0311-metadata:
  v0311-cache:
  v0311-blobs:
  v0311-plugin-data:
  dev-config:
  dev-generated:
  dev-metadata:
  dev-cache:
  dev-blobs:
  dev-plugin-data:
  demo-config:
  demo-generated:
  demo-metadata:
  demo-cache:
  demo-blobs:
  demo-plugin-data:
